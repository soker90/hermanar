name: CI - Lint, Format, Build & Test

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    # Job 1: Linter y Prettier para Frontend
    lint-format:
        name: Lint & Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

            - name: Run Prettier check
              run: pnpm run format:check

    # Job 2: Build Frontend
    build-frontend:
        name: Build Frontend
        runs-on: ubuntu-latest
        needs: lint-format

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build frontend
              run: pnpm run build

            - name: Upload dist artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist-frontend
                  path: dist/
                  retention-days: 1

    # Job 3: Build & Test Backend (Rust)
    build-test-backend:
        name: Build & Test Backend
        runs-on: ubuntu-latest
        needs: [lint-format, build-frontend]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download dist artifact
              uses: actions/download-artifact@v4
              with:
                  name: dist-frontend
                  path: dist/

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: 'src-tauri'

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libssl-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: Run Clippy (Rust Linter)
              run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings

            - name: Check Rust formatting
              run: cd src-tauri && cargo fmt -- --check

            - name: Build backend
              run: cd src-tauri && cargo build --release

            - name: Run backend tests
              run: cd src-tauri && cargo test --lib --release
